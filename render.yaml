services:
  # Backend Spring Boot Service
  - type: web
    name: homestay-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: local
      - key: DB_PORT
        value: 3306
      - key: DB_USERNAME
        value: root
      - key: DB_PASSWORD
        value: root
      - key: JWT_SECRET
        value: homestay_jwt_secret_key_2026_super_secure_sep490_abcdef123456
      - key: FRONTEND_BASE_URL
        value: "*"

  # Frontend Static Site (React Vite)
  - type: web
    name: homestay-frontend
    runtime: static
    rootDir: frontendHomestayManagement
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
