spring.application.name=homestayManagement
spring.config.import=optional:file:.env[.properties],optional:file:homestayManagement/.env[.properties]
server.port=8080
spring.profiles.active=local

# File upload
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=60MB

# MySQL datasource
spring.datasource.url=jdbc:mysql://localhost:${DB_PORT}/homestayManagement?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
logging.level.org.hibernate.SQL=OFF 

logging.level.org.hibernate.orm.jdbc.bind=OFF

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# Google Login
app.google.client-id=${GOOGLE_CLIENT_ID}

# Mail (Gmail SMTP) - dung App Password, khong dung mat khau chinh
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_USERNAME}
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}
app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:8080}

# Customer AI assistant (Spring Boot -> OpenChatBI Python sidecar)
ai.customer.service-url=${AI_CUSTOMER_SERVICE_URL:http://127.0.0.1:8001}
ai.customer.internal-token=${AI_INTERNAL_TOKEN:}
ai.customer.timeout-seconds=${AI_CUSTOMER_TIMEOUT_SECONDS:60}
ai.customer.rate-limit-per-minute=${AI_CUSTOMER_RATE_LIMIT_PER_MINUTE:20}
ai.customer.sidecar.auto-start=${AI_CUSTOMER_SIDECAR_AUTO_START:true}
ai.customer.sidecar.working-directory=${AI_CUSTOMER_SIDECAR_WORKING_DIRECTORY:../openchatbi}
ai.customer.sidecar.env-file=${AI_CUSTOMER_SIDECAR_ENV_FILE:customer_assistant/.env}
ai.customer.sidecar.uv-command=${AI_CUSTOMER_SIDECAR_UV_COMMAND:uv}

# Marketing AI content generation runs directly inside Spring Boot.
marketing.openrouter.enabled=${MARKETING_OPENROUTER_ENABLED:true}
marketing.openrouter.api-key=${MARKETING_OPENROUTER_API_KEY:}
marketing.openrouter.base-url=${MARKETING_OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
marketing.openrouter.model=${MARKETING_OPENROUTER_MODEL:openai/gpt-4o-mini}
marketing.openrouter.timeout-seconds=${MARKETING_OPENROUTER_TIMEOUT_SECONDS:60}

# Legacy sidecar bridge is disabled by default. Keep only for rollback/testing.
marketing.aiagent.enabled=${MARKETING_AIAGENT_ENABLED:false}
marketing.aiagent.base-url=${MARKETING_AIAGENT_BASE_URL:http://127.0.0.1:8787}
marketing.aiagent.auth-token=${MARKETING_AIAGENT_AUTH_TOKEN:}
marketing.aiagent.generate-path=${MARKETING_AIAGENT_GENERATE_PATH:/api/homestay/marketing/generate}
marketing.aiagent.publish-path=${MARKETING_AIAGENT_PUBLISH_PATH:/api/homestay/marketing/publish}
marketing.aiagent.social-auth-start-path=${MARKETING_AIAGENT_SOCIAL_AUTH_START_PATH:/api/homestay/social/auth/start}
marketing.aiagent.social-auth-status-path=${MARKETING_AIAGENT_SOCIAL_AUTH_STATUS_PATH:/api/homestay/social/auth/status}
marketing.aiagent.social-accounts-path=${MARKETING_AIAGENT_SOCIAL_ACCOUNTS_PATH:/api/homestay/social/accounts}
marketing.aiagent.timeout-seconds=${MARKETING_AIAGENT_TIMEOUT_SECONDS:90}
marketing.aiagent.sidecar.auto-start=${MARKETING_AIAGENT_SIDECAR_AUTO_START:false}
marketing.aiagent.sidecar.working-directory=${MARKETING_AIAGENT_SIDECAR_WORKING_DIRECTORY:../aiagent/homestay-marketing-agent}
marketing.aiagent.sidecar.node-command=${MARKETING_AIAGENT_SIDECAR_NODE_COMMAND:node}

# AiToEarn source is reference-only now, not runtime.
marketing.aitoearn.local.auto-start=${MARKETING_AITOEARN_LOCAL_AUTO_START:false}
marketing.aitoearn.local.health-url=${MARKETING_AITOEARN_LOCAL_HEALTH_URL:http://127.0.0.1:7001/api/v2/channels/accounts}
marketing.aitoearn.local.working-directory=${MARKETING_AITOEARN_LOCAL_WORKING_DIRECTORY:../aiagent/AiToEarn/project/aitoearn-backend}
marketing.aitoearn.local.package-manager-command=${MARKETING_AITOEARN_LOCAL_PACKAGE_MANAGER_COMMAND:}
marketing.aitoearn.local.serve-script=${MARKETING_AITOEARN_LOCAL_SERVE_SCRIPT:server:serve}

# Social OAuth apps stored/used in MySQL.
marketing.social.facebook.client-id=${MARKETING_SOCIAL_FACEBOOK_CLIENT_ID:}
marketing.social.facebook.client-secret=${MARKETING_SOCIAL_FACEBOOK_CLIENT_SECRET:}
marketing.social.facebook.redirect-uri=${MARKETING_SOCIAL_FACEBOOK_REDIRECT_URI:http://localhost:8080/api/marketing/social/oauth/callback}
marketing.social.facebook.scopes=${MARKETING_SOCIAL_FACEBOOK_SCOPES:pages_show_list,pages_read_engagement,pages_manage_posts}

# Legacy direct AiToEarn relay. Prefer marketing.aiagent.* for option B.
marketing.aitoearn.enabled=${MARKETING_AITOEARN_ENABLED:false}
marketing.aitoearn.api-base-url=${MARKETING_AITOEARN_API_BASE_URL:}
marketing.aitoearn.api-key=${MARKETING_AITOEARN_API_KEY:}
marketing.aitoearn.timeout-seconds=${MARKETING_AITOEARN_TIMEOUT_SECONDS:45}

# SePay
sepay.bank-name=${SEPAY_BANK_NAME:}
sepay.account-number=${SEPAY_ACCOUNT_NUMBER:}
sepay.account-holder=${SEPAY_ACCOUNT_HOLDER:}
sepay.payment-code-prefix=${SEPAY_PAYMENT_CODE_PREFIX:HMS}
sepay.transfer-prefix=${SEPAY_TRANSFER_PREFIX:}
sepay.webhook-secret=${SEPAY_WEBHOOK_SECRET:}
