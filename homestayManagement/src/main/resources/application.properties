spring.application.name=homestayManagement
spring.config.import=optional:file:.env[.properties],optional:file:homestayManagement/.env[.properties]
server.port=8080
spring.profiles.active=local

# File upload
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=60MB

# MySQL datasource
spring.datasource.url=jdbc:mysql://localhost:${DB_PORT}/homestayManagement?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
logging.level.org.hibernate.SQL=OFF 

logging.level.org.hibernate.orm.jdbc.bind=OFF

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# Google Login
app.google.client-id=${GOOGLE_CLIENT_ID}

# Mail (Gmail SMTP) - dung App Password, khong dung mat khau chinh
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_USERNAME}
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}
app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:8080}

# Customer AI Assistant (OpenChatBI Python sidecar)
ai.customer.service-url=${AI_CUSTOMER_SERVICE_URL:http://127.0.0.1:8001}
ai.customer.internal-token=${AI_INTERNAL_TOKEN:}
ai.customer.timeout-seconds=${AI_CUSTOMER_TIMEOUT_SECONDS:60}
ai.customer.rate-limit-per-minute=${AI_CUSTOMER_RATE_LIMIT_PER_MINUTE:20}
ai.customer.sidecar.auto-start=${AI_CUSTOMER_SIDECAR_AUTO_START:true}
ai.customer.sidecar.working-directory=${AI_CUSTOMER_SIDECAR_WORKING_DIRECTORY:../openchatbi}
ai.customer.sidecar.env-file=${AI_CUSTOMER_SIDECAR_ENV_FILE:customer_assistant/.env}
ai.customer.sidecar.uv-command=${AI_CUSTOMER_SIDECAR_UV_COMMAND:uv}

# ============================================================================
# FPT AI FACTORY CONFIGURATION
# ============================================================================

# Marketing AI content generation - Uses FPT AI Factory
marketing.ai.enabled=${MARKETING_AI_ENABLED:true}
marketing.ai.provider=${MARKETING_AI_PROVIDER:fpt}
marketing.ai.api-key=${MARKETING_AI_API_KEY:}
marketing.ai.base-url=${MARKETING_AI_BASE_URL:https://mkp-api.fptcloud.com/v1}
marketing.ai.chat-path=${MARKETING_AI_CHAT_PATH:/chat/completions}
marketing.ai.model=${MARKETING_AI_MODEL:GLM-5.2}
marketing.ai.compatibility-mode=${MARKETING_AI_COMPATIBILITY_MODE:generic}
marketing.ai.auth-header-name=${MARKETING_AI_AUTH_HEADER_NAME:Authorization}
marketing.ai.auth-header-prefix=${MARKETING_AI_AUTH_HEADER_PREFIX:Bearer}
marketing.ai.timeout-seconds=${MARKETING_AI_TIMEOUT_SECONDS:60}

# Scheduled marketing publisher.
marketing.scheduler.enabled=${MARKETING_SCHEDULER_ENABLED:true}
marketing.scheduler.publish-fixed-delay-ms=${MARKETING_SCHEDULER_PUBLISH_FIXED_DELAY_MS:5000}

# Facebook Social OAuth
marketing.social.facebook.client-id=${MARKETING_SOCIAL_FACEBOOK_CLIENT_ID:}
marketing.social.facebook.client-secret=${MARKETING_SOCIAL_FACEBOOK_CLIENT_SECRET:}
marketing.social.facebook.redirect-uri=${MARKETING_SOCIAL_FACEBOOK_REDIRECT_URI:http://localhost:8080/api/marketing/social/oauth/callback}
marketing.social.facebook.scopes=${MARKETING_SOCIAL_FACEBOOK_SCOPES:pages_show_list,pages_read_engagement,pages_manage_posts}

# SePay
sepay.bank-name=${SEPAY_BANK_NAME:}
sepay.account-number=${SEPAY_ACCOUNT_NUMBER:}
sepay.account-holder=${SEPAY_ACCOUNT_HOLDER:}
sepay.payment-code-prefix=${SEPAY_PAYMENT_CODE_PREFIX:HMS}
sepay.transfer-prefix=${SEPAY_TRANSFER_PREFIX:}
sepay.webhook-secret=${SEPAY_WEBHOOK_SECRET:}
